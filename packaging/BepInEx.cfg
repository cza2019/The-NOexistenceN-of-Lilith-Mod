[Logging]

## Keep Unity messages available in the disk log for diagnostics.
UnityLogListening = true

[Logging.Console]

## Public builds do not open a persistent debug console.
Enabled = false
PreventClose = false
ShiftJisEncoding = false
StandardOutType = Auto
LogLevels = Fatal, Error, Warning, Message, Info

[Logging.Disk]

AppendLog = false
Enabled = true
LogLevels = Fatal, Error, Warning, Message, Info
InstantFlushing = false
WriteUnityLog = false
